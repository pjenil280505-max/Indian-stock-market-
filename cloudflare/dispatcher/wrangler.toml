# Cloudflare Worker: Cron -> GitHub workflow_dispatch. PRODUCTION (data
# collection only), approved in docs/PHASE_1_REPORT.md Addendum I.4.
#
# No secrets live in this file. The Worker's two secrets are uploaded at
# deploy time by .github/workflows/cloudflare-worker.yml from GitHub Secrets:
#   GH_DISPATCH_TOKEN  fine-grained PAT, this repo only, Actions: write
#   TEST_TRIGGER_KEY   random per deploy, rotated away after the smoke test
name = "nse-pipeline-dispatcher"
main = "src/index.js"
compatibility_date = "2026-09-01"

# workers.dev is needed only for the one-shot deployed smoke test. Every path
# except POST /__test-dispatch returns 404, and that one needs a key nobody
# holds once the deploy workflow has rotated it.
workers_dev = true
preview_urls = false

[triggers]
# All UTC.
#   37 4 * * *          TEST: once a day, dispatches only the no-op probe.
#   */15 11-14 * * 1-5  PRODUCTION: every 15 min 11:00-14:45 on weekdays;
#                       each fire passes the readiness gate before it can
#                       dispatch daily-data-update.yml (at most once a day).
crons = ["37 4 * * *", "*/15 11-14 * * 1-5"]

[vars]
GITHUB_OWNER = "pjenil280505-max"
GITHUB_REPO = "Indian-stock-market-"
GITHUB_REF = "main"
TEST_CRONS = "37 4 * * *"
# Production needs BOTH of these AND the cron in [triggers]; the exact values
# are pinned by tests/test_cloudflare_guards.py::TestProductionConfig.
PRODUCTION_CRONS = "*/15 11-14 * * 1-5"
PRODUCTION_ENABLED = "true"
# Readiness gate (src/readiness.js), used only by production fires: from this
# UTC time a UDiFF-only day is accepted as "partial" instead of waiting for
# the delivery file.
READINESS_FINAL_UTC = "14:45"

[observability]
enabled = true
head_sampling_rate = 1
