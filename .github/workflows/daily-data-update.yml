name: Daily data update

# Scheduled runs only fire for workflow files on the default branch.
# India observes no DST, so the +5:30 offset is stable year-round.
#
# Two fires per trading day, both idempotent, so the second costs nothing
# when the first already succeeded:
#
#   11:41 UTC = 17:11 IST - 101 min after the 15:30 IST close. The bhavcopy
#     is normally published by then. If the delivery file is not, the day is
#     recorded 'partial' and the later run enriches it.
#   14:17 UTC = 19:47 IST - safety net, by which point sec_bhavdata_full is
#     reliably available. Also covers a missed or heavily delayed first fire.
#
# Neither is on the hour. The previous schedule used minute 0 and was observed
# firing 4h48m late on 2026-09-23; GitHub's own guidance is that :00 is the
# worst minute to pick, which the earlier schedule ignored.
on:
  schedule:
    - cron: '41 11 * * 1-5'
    - cron: '17 14 * * 1-5'
  workflow_dispatch:
    inputs:
      catchup_days:
        description: 'How many days back to catch up'
        required: false
        default: '10'

concurrency:
  # Never let two runs write concurrently; a delayed run must not race a manual one.
  group: daily-data-update
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check connection
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scripts/check_connection.py

      - name: Run data update
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/daily_update.py --catchup-days "${{ inputs.catchup_days || 10 }}"

      # The pipeline exits non-zero when it halts on an integrity error, so a
      # failed job here means data was rejected, not silently accepted.
      - name: Report failure
        if: failure()
        run: echo "::error::Daily data update failed - check the log above."
