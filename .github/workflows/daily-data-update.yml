name: Daily data update

# PRIMARY trigger: the Cloudflare Worker (cloudflare/dispatcher), every 15
# min 11:00-14:45 UTC on weekdays, dispatching this workflow only once NSE
# has published the day's file (readiness gate) and no run for the day
# exists yet (duplicate protection).
#
# FALLBACK: GitHub's own schedule, 14:17 UTC on weekdays. Measured 250-288
# min late, so it lands ~18:30 UTC. Its first step exits without touching
# anything if a Cloudflare run for the day already succeeded, so it only does
# work when Cloudflare did not (e.g. an expired dispatch token). It needs no
# Cloudflare credentials, which is why it is kept.
#
# Scheduled runs only fire for workflow files on the default branch.
# India observes no DST, so the +5:30 offset is stable year-round.
# Run names identify the trigger in the Actions list:
#   "Daily data update (cloudflare 2026-09-25 <request id>)"  Cloudflare Worker
#   "Daily data update (schedule)"                            GitHub's own cron
#   "Daily data update (workflow_dispatch)"                   manual run
# The Worker's readiness gate reads this name to know whether today's run
# already exists, so the "cloudflare <date>" format is load-bearing.
run-name: >-
  ${{ inputs.request_id
      && format('Daily data update (cloudflare {0} {1})', inputs.trade_date, inputs.request_id)
      || format('Daily data update ({0})', github.event_name) }}

on:
  schedule:
    - cron: '17 14 * * 1-5'
  workflow_dispatch:
    inputs:
      catchup_days:
        description: 'How many days back to catch up'
        required: false
        default: '10'
      request_id:
        description: 'Set by the Cloudflare Worker; leave blank for manual runs'
        required: false
        default: ''
      trade_date:
        description: 'Set by the Cloudflare Worker (IST trade date it verified as published); leave blank'
        required: false
        default: ''

concurrency:
  # One writer lock for every job that writes to the database: this job, the
  # historical backfill and the migrations workflow all use `database-writer`,
  # so none of them can run at the same time as another. (Before Phase 1a this
  # group was `daily-data-update`, which did NOT exclude the backfill.)
  #
  # GitHub keeps at most one pending run per group: if a second run queues
  # while one is already pending, the older pending run is cancelled. Every
  # writer here is idempotent and resumable, so a cancelled pending run loses
  # no data - it is simply picked up by the next run.
  group: database-writer
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # fallback step reads today's runs; cannot dispatch or write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # GitHub's schedule is now only a FALLBACK behind the Cloudflare
      # Worker. If a Cloudflare-dispatched run for today already succeeded,
      # this scheduled run stops here and touches nothing.
      - name: Fallback only - skip if Cloudflare already loaded today
        id: fallback
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # UTC date, NOT IST: this fire lands ~18:30 UTC, already tomorrow in IST.
          day=$(date -u +%Y-%m-%d)
          n=$(gh api -X GET "repos/$REPO/actions/workflows/daily-data-update.yml/runs" \
                -f event=workflow_dispatch -f status=success -f created=">=$day" -f per_page=50 \
                --jq "[.workflow_runs[] | select(.display_title | contains(\"cloudflare $day\"))] | length")
          if [ "$n" -gt 0 ]; then
            echo "Cloudflare already loaded $day ($n successful run(s)); fallback not needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No successful Cloudflare run for $day; fallback runs the pipeline."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.fallback.outputs.skip != 'true'

      - uses: actions/setup-python@v5
        if: steps.fallback.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.fallback.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Check connection
        if: steps.fallback.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 scripts/check_connection.py

      - name: Run data update
        if: steps.fallback.outputs.skip != 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          UPSTOX_ANALYTICS_TOKEN: ${{ secrets.UPSTOX_ANALYTICS_TOKEN }}
          GITHUB_SHA: ${{ github.sha }}
        run: python3 scripts/daily_update.py --catchup-days "${{ inputs.catchup_days || 10 }}"

      # The pipeline exits non-zero when it halts on an integrity error, so a
      # failed job here means data was rejected, not silently accepted.
      - name: Report failure
        if: failure()
        run: echo "::error::Daily data update failed - check the log above."
