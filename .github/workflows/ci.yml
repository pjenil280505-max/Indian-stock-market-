name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        env:
          # Exercises the schema and every idempotency guarantee against real
          # PostgreSQL. Neon is ordinary PostgreSQL, so this carries over.
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: python3 -m pytest tests/ -q

      - name: Verify read-only guarantees
        run: python3 -m pytest tests/test_read_only.py -q

  worker:
    # Cloudflare dispatcher: unit tests plus an offline bundle check.
    # Uses no Cloudflare credentials and deploys nothing.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloudflare/dispatcher
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Bundle check (no upload)
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker-dist"
