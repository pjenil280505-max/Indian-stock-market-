name: Cloudflare Worker

# Deploys and tests the Cron -> GitHub dispatcher in cloudflare/dispatcher.
# Manual only. Never touches Neon (no DATABASE_URL here), never runs the
# data pipeline, and can only cause the no-op probe workflow to run.
#
#   check-secrets    Report which required secrets are set (yes/no only).
#   local-test       Run the Worker in Wrangler's local runtime on this runner
#                    and fire its TEST cron. Makes one REAL dispatch of the
#                    probe workflow using GH_DISPATCH_TOKEN. Needs no
#                    Cloudflare credentials.
#   deploy-and-test  Deploy to Cloudflare, invoke the DEPLOYED Worker once
#                    through its key-guarded test endpoint (one probe
#                    dispatch), then rotate the key to a value nobody holds.
#   nse-connectivity-test
#                    Deploy, then have the DEPLOYED Worker GET each NSE
#                    resource the pipeline uses, once, and report status,
#                    latency and payload structure. The same requests are
#                    repeated from this GitHub runner for comparison.
#                    Read-only: nothing is stored, nothing is dispatched,
#                    Neon and Upstox are not contacted. Key rotated after.
#   readiness-dry-run
#                    Deploy, then evaluate the production readiness gate on
#                    the DEPLOYED Worker for each DATE@HH:MM case: reads
#                    GitHub runs and NSE files, returns the decision, and
#                    NEVER dispatches. Key rotated after.
#
# Secrets (repository secrets; values never printed):
#   CLOUDFLARE_API_TOKEN   Account token, Workers Scripts: Edit, this account only
#   CLOUDFLARE_ACCOUNT_ID
#   GH_DISPATCH_TOKEN      Fine-grained PAT, this repo only, Actions: read and write
on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to do'
        required: true
        type: choice
        options: [check-secrets, local-test, deploy-and-test, nse-connectivity-test, readiness-dry-run]
        default: check-secrets
      trade_date:
        description: 'nse-connectivity-test only: a PUBLISHED trading day, YYYY-MM-DD'
        required: false
        default: ''
      readiness_cases:
        description: 'readiness-dry-run only: comma-separated DATE@HH:MM (UTC), e.g. 2026-09-25@11:45,2026-09-28@11:00'
        required: false
        default: ''

concurrency:
  group: cloudflare-worker
  cancel-in-progress: false

permissions:
  contents: read

env:
  TEST_CRON: '37 4 * * *'

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: cloudflare/dispatcher
    steps:
      - name: Secrets present?
        working-directory: .
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          ACTION: ${{ inputs.action }}
        run: |
          missing=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID GH_DISPATCH_TOKEN; do
            if [ -n "${!name}" ]; then echo "$name: present"; else echo "$name: MISSING"; missing=1; fi
          done
          case "$ACTION" in
            local-test)      [ -n "$GH_DISPATCH_TOKEN" ] || { echo "::error::GH_DISPATCH_TOKEN is required"; exit 1; } ;;
            deploy-and-test) [ "$missing" = 0 ] || { echo "::error::all three secrets are required"; exit 1; } ;;
          esac

      - if: inputs.action != 'check-secrets'
        uses: actions/checkout@v4

      - if: inputs.action != 'check-secrets'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and unit-test
        if: inputs.action != 'check-secrets'
        run: |
          npm ci --no-audit --no-fund
          npm test

      # ---------------------------------------------------------- local-test
      - name: Local cron test (real dispatch of the probe workflow)
        if: inputs.action == 'local-test'
        env:
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          printf 'GH_DISPATCH_TOKEN=%s\n' "$GH_DISPATCH_TOKEN" > .dev.vars
          npx wrangler dev --test-scheduled --ip 127.0.0.1 --port 8787 \
            --show-interactive-dev-session=false > "$RUNNER_TEMP/dev.log" 2>&1 &
          pid=$!
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:8787/ && break; sleep 1; done
          curl -sf "http://127.0.0.1:8787/cdn-cgi/local/scheduled?cron=${TEST_CRON// /+}"
          echo
          sleep 3
          kill "$pid" || true
          rm -f .dev.vars
          echo "--- Worker log events"
          grep -E '"event"' "$RUNNER_TEMP/dev.log" || true
          grep -q '"event":"dispatch_ok"' "$RUNNER_TEMP/dev.log"

      # ----------------------------------------------------- deploy-and-test
      - name: Deploy
        id: deploy
        if: inputs.action == 'deploy-and-test' || inputs.action == 'nse-connectivity-test' || inputs.action == 'readiness-dry-run'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          key=$(openssl rand -hex 32)
          echo "::add-mask::$key"
          echo "TEST_KEY=$key" >> "$GITHUB_ENV"
          SECRETS_FILE="$RUNNER_TEMP/worker.secrets.json" KEY="$key" python3 - <<'PY'
          import json, os
          with open(os.environ["SECRETS_FILE"], "w") as f:
              json.dump({"GH_DISPATCH_TOKEN": os.environ["GH_DISPATCH_TOKEN"],
                         "TEST_TRIGGER_KEY": os.environ["KEY"]}, f)
          PY
          npx wrangler deploy --secrets-file "$RUNNER_TEMP/worker.secrets.json" 2>&1 | tee "$RUNNER_TEMP/deploy.log"
          rm -f "$RUNNER_TEMP/worker.secrets.json"
          url=$(grep -oE 'https://nse-pipeline-dispatcher\.[a-z0-9-]+\.workers\.dev' "$RUNNER_TEMP/deploy.log" | head -1 || true)
          if [ -z "$url" ]; then
            echo "::error::No workers.dev URL in deploy output. Open Workers & Pages in the Cloudflare dashboard once to register a workers.dev subdomain, then re-run."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Invoke the deployed Worker once (test mode)
        if: inputs.action == 'deploy-and-test'
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -uo pipefail
          # A new deployment or subdomain can take a little while to be served.
          # Retry only while the Worker is not yet answering; a 200 (dispatched)
          # or 502 (dispatch failed) ends the loop, so at most one dispatch.
          for i in $(seq 1 36); do
            code=$(curl -s -o "$RUNNER_TEMP/invoke.json" -w '%{http_code}' -X POST \
                   -H "Authorization: Bearer $TEST_KEY" "$URL/__test-dispatch" || echo 000)
            echo "attempt $i: HTTP $code"
            case "$code" in 200|502) break ;; esac
            sleep 5
          done
          echo "--- Worker response"
          cat "$RUNNER_TEMP/invoke.json"; echo
          [ "$code" = 200 ] || { echo "::error::deployed Worker did not dispatch (HTTP $code)"; exit 1; }
          python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['ok'] and d['kind']=='test' and d['workflow']=='cloudflare-dispatch-probe.yml', d; print('GitHub run id:', d.get('workflow_run_id'))" "$RUNNER_TEMP/invoke.json"

      # ----------------------------------------------- nse-connectivity-test
      - name: Cloudflare -> NSE (deployed Worker, one GET per target)
        if: inputs.action == 'nse-connectivity-test'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          set -uo pipefail
          [[ "$TRADE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "::error::trade_date (YYYY-MM-DD) is required"; exit 1; }
          TODAY=$(date -u +%Y-%m-%d)
          mkdir -p "$RUNNER_TEMP/nse"
          n=0
          for spec in "universe" "delivery_bhavcopy&date=$TRADE_DATE" "udiff_bhavcopy&date=$TRADE_DATE" \
                      "corporate_actions" "delivery_bhavcopy&date=$TODAY"; do
            n=$((n+1))
            # Retry only while the new deployment is not yet serving (the
            # Worker answers 200 for every probe it runs, whatever NSE says),
            # so each target is requested from NSE exactly once.
            for i in $(seq 1 36); do
              code=$(curl -s -o "$RUNNER_TEMP/nse/cf_$n.json" -w '%{http_code}' -X POST \
                     -H "Authorization: Bearer $TEST_KEY" "$URL/__test-nse?target=$spec" || echo 000)
              [ "$code" = 200 ] && break
              echo "target $n: Worker not ready (HTTP $code), retrying"; sleep 5
            done
            echo "--- cloudflare probe $n ($spec)"; cat "$RUNNER_TEMP/nse/cf_$n.json"; echo
            sleep 2   # courtesy pause between NSE requests
          done

      - name: GitHub runner -> NSE (same requests, for comparison)
        if: inputs.action == 'nse-connectivity-test'
        env:
          TRADE_DATE: ${{ inputs.trade_date }}
        run: |
          set -uo pipefail
          UA='indian-stock-research/0.1 (+personal research; contact via repository owner)'
          TODAY=$(date -u +%Y-%m-%d)
          d() { date -u -d "$1" +"$2"; }
          urls=(
            "universe|https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv"
            "delivery_bhavcopy $TRADE_DATE|https://nsearchives.nseindia.com/products/content/sec_bhavdata_full_$(d "$TRADE_DATE" %d%m%Y).csv"
            "udiff_bhavcopy $TRADE_DATE|https://nsearchives.nseindia.com/content/cm/BhavCopy_NSE_CM_0_0_0_$(d "$TRADE_DATE" %Y%m%d)_F_0000.csv.zip"
            "corporate_actions|https://www.nseindia.com/api/corporates-corporateActions?index=equities"
            "delivery_bhavcopy $TODAY|https://nsearchives.nseindia.com/products/content/sec_bhavdata_full_$(d "$TODAY" %d%m%Y).csv"
          )
          : > "$RUNNER_TEMP/nse/gh.tsv"
          for entry in "${urls[@]}"; do
            name=${entry%%|*}; url=${entry#*|}
            m=$(curl -s -o /dev/null -A "$UA" --max-time 60 \
                -w '%{http_code}\t%{time_starttransfer}\t%{time_total}\t%{size_download}\t%{content_type}' "$url" || echo "000")
            printf '%s\t%s\n' "$name" "$m" | tee -a "$RUNNER_TEMP/nse/gh.tsv"
            sleep 2
          done

      - name: Connectivity summary
        if: inputs.action == 'nse-connectivity-test'
        run: |
          python3 - "$RUNNER_TEMP/nse" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import glob, json, os, sys
          d = sys.argv[1]
          print("| # | target | CF status | CF headers ms | CF total ms | bytes | blocked? | data check | GH status | GH total ms |")
          print("|---|---|---|---|---|---|---|---|---|---|")
          gh = [l.rstrip("\n").split("\t") for l in open(os.path.join(d, "gh.tsv"))]
          for i, row in enumerate(gh, 1):
              try:
                  r = json.load(open(os.path.join(d, f"cf_{i}.json")))
              except Exception:
                  r = {}
              data = r.get("data") or {}
              check = (f"{data.get('rows')} rows" if "rows" in data else
                       f"zip ok={data.get('valid')}" if "valid" in data else
                       f"{data.get('records')} records" if "records" in data else
                       r.get("parse_error") or r.get("error") or "-")
              gh_status = row[1] if len(row) > 1 else "?"
              gh_total = f"{float(row[3]) * 1000:.0f}" if len(row) > 3 else "?"
              print(f"| {i} | {row[0]} | {r.get('status')} | {r.get('headers_ms')} | {r.get('total_ms')} | "
                    f"{r.get('bytes')} | {r.get('blocked_suspected')} | {check} | {gh_status} | {gh_total} |")
          colo = {json.load(open(f)).get("cloudflare", {}).get("colo") for f in glob.glob(os.path.join(d, "cf_*.json"))}
          print(f"\nCloudflare colo(s) that ran the probes: {sorted(c for c in colo if c)}")
          PY

      # --------------------------------------------------- readiness-dry-run
      - name: Readiness gate dry run (deployed Worker, never dispatches)
        if: inputs.action == 'readiness-dry-run'
        env:
          URL: ${{ steps.deploy.outputs.url }}
          CASES: ${{ inputs.readiness_cases }}
        run: |
          set -uo pipefail
          [[ "$CASES" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}@[0-9]{2}:[0-9]{2}(,[0-9]{4}-[0-9]{2}-[0-9]{2}@[0-9]{2}:[0-9]{2})*$ ]] \
            || { echo "::error::readiness_cases must be DATE@HH:MM[,DATE@HH:MM...]"; exit 1; }
          IFS=, read -ra cases <<< "$CASES"
          fail=0
          for c in "${cases[@]}"; do
            d=${c%@*}; t=${c#*@}
            for i in $(seq 1 36); do
              code=$(curl -s -o "$RUNNER_TEMP/ready.json" -w '%{http_code}' -X POST \
                     -H "Authorization: Bearer $TEST_KEY" "$URL/__test-readiness?date=$d&at=$t" || echo 000)
              [ "$code" = 200 ] && break
              echo "Worker not ready (HTTP $code), retrying"; sleep 5
            done
            echo "--- case $d at $t UTC"
            cat "$RUNNER_TEMP/ready.json"; echo
            python3 -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['dry_run'] is True and d['dispatched'] is False, d; print('DECISION:', d['decision']['action'], '-', d['decision']['reason'])" "$RUNNER_TEMP/ready.json" || fail=1
            sleep 2
          done
          exit $fail

      - name: Rotate the test key away and prove the old one is dead
        if: always() && (inputs.action == 'deploy-and-test' || inputs.action == 'nse-connectivity-test' || inputs.action == 'readiness-dry-run') && steps.deploy.outputs.url != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -uo pipefail
          new=$(openssl rand -hex 32)
          echo "::add-mask::$new"
          printf '%s' "$new" | npx wrangler secret put TEST_TRIGGER_KEY
          unset new
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $TEST_KEY" "$URL/__test-auth")
            echo "old key -> HTTP $code"
            [ "$code" = 401 ] && exit 0
            sleep 5
          done
          echo "::error::old test key still accepted"; exit 1

      - name: Remove local secret files
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/worker.secrets.json" cloudflare/dispatcher/.dev.vars
